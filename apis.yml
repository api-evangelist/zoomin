name: Zoomin
description: 'Zoomin is a content and knowledge orchestration platform that unifies
  unstructured product content — documentation, in-product help, knowledge base and
  community answers — into personalized self-service and in-app experiences across
  customer support, success and experience teams. Founded in Tel Aviv, Zoomin was
  acquired by Salesforce on November 1, 2024 and now powers the Unified Knowledge and
  Agentforce/Data Cloud offerings. Its products include the Content Delivery Platform,
  Documentation Portal, In-Product Help, Zoomin for ServiceNow, Unified Knowledge and
  Zoomin Analytics. Zoomin does not publish a public, self-serve developer API surface;
  its integrations are delivered through customer implementations and the Salesforce
  platform. This profile was surfaced as a Bessemer Venture Partners portfolio company.'
